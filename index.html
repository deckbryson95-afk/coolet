<!DOCTYPE html>
<html>
<head>
    <title>Coolet</title>

    <style>
        @font-face {
            font-family: "Puffet";
            src: url("puffet.ttf") format("truetype");
        }

        body {
            background-color: #FF9900;
            background-image:
                linear-gradient(45deg, #E67E00 25%, transparent 25%),
                linear-gradient(-45deg, #E67E00 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #E67E00 75%),
                linear-gradient(-45deg, transparent 75%, #E67E00 75%);
            background-size: 100px 100px;
            background-position: 0 0, 0 50px, 50px -50px, -50px 0;
            background-attachment: fixed;

            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
        }

        .logo {
            font-family: "Puffet", sans-serif;
            font-size: 200px;
            font-weight: normal;
            margin-bottom: 0;
        }

        p {
            font-size: 22px;
            margin-top: 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 40px;
        }

        button {
            cursor: pointer;
        }

        .buttons button {
            background-color: green;
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
        }

        .buttons button:hover {
            background-color: darkgreen;
        }

        .hidden {
            display: none !important;
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-box {
            background: #252525;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            position: relative;
        }

        .auth-box h2 {
            font-size: 30px;
            margin-top: 5px;
        }

        .auth-box input {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            box-sizing: border-box;
            border: 2px solid #888;
            border-radius: 6px;
            font-size: 16px;
        }

        .auth-submit {
            background: green;
            color: white;
            border: none;
            padding: 13px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .auth-submit:hover {
            background: darkgreen;
        }

        .close-button {
            position: absolute;
            right: 12px;
            top: 10px;
            background: transparent;
            color: white;
            border: none;
            font-size: 25px;
        }

        #authMessage {
            font-size: 14px;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        #welcomeMessage {
            font-size: 18px;
            margin-top: 25px;
        }

        #logoutButton {
            background: #333;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 90px;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1 class="logo">COOLET</h1>

    <p>Collect, trade, chat and more!</p>

    <div class="buttons" id="mainButtons">
        <button onclick="openAuth('login')">Login</button>
        <button onclick="openAuth('signup')">Sign Up</button>
    </div>

    <div id="welcomeArea" class="hidden">
        <p id="welcomeMessage"></p>
        <button id="logoutButton" onclick="logout()">Logout</button>
    </div>

    <div class="auth-overlay hidden" id="authOverlay">
        <div class="auth-box">

            <button class="close-button" onclick="closeAuth()">×</button>

            <h2 id="authTitle">Login</h2>

            <form id="authForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    minlength="3"
                    maxlength="20"
                    pattern="[a-zA-Z0-9_]+"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    minlength="6"
                    autocomplete="current-password"
                    required
                >

                <button class="auth-submit" id="authSubmit" type="submit">
                    Login
                </button>

            </form>

            <p id="authMessage"></p>

        </div>
    </div>

    <script>
        // SUPABASE CONNECTION
        const SUPABASE_URL = "https://mfxmatyyvrjxkleiratk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_kfMaUjlxX04k1YWkJTu9mw_fq24cRu9";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        // Internal login address domain.
        // Players never have to enter an email.
        const AUTH_EMAIL_DOMAIN = "mfxmatyyvrjxkleiratk.supabase.co";

        let authMode = "login";

        function makeLoginEmail(username) {
            return username.toLowerCase() + "@" + AUTH_EMAIL_DOMAIN;
        }

        function openAuth(mode) {
            authMode = mode;

            document.getElementById("authOverlay").classList.remove("hidden");
            document.getElementById("authTitle").textContent =
                mode === "signup" ? "Create Account" : "Login";

            document.getElementById("authSubmit").textContent =
                mode === "signup" ? "Create Account" : "Login";

            document.getElementById("password").autocomplete =
                mode === "signup" ? "new-password" : "current-password";

            document.getElementById("authForm").reset();
            showMessage("");
        }

        function closeAuth() {
            document.getElementById("authOverlay").classList.add("hidden");
        }

        function showMessage(message, color = "white") {
            const messageBox = document.getElementById("authMessage");
            messageBox.textContent = message;
            messageBox.style.color = color;
        }

        function showLoggedIn(username) {
            document.getElementById("mainButtons").classList.add("hidden");
            document.getElementById("welcomeArea").classList.remove("hidden");

            document.getElementById("welcomeMessage").textContent =
                "Welcome to Coolet, " + username + "!";

            closeAuth();
        }

        // SIGN UP AND LOGIN
        document.getElementById("authForm").addEventListener(
            "submit",
            async function(event) {
                event.preventDefault();

                const username = document.getElementById("username")
                    .value.trim().toLowerCase();

                const password = document.getElementById("password").value;

                const submitButton = document.getElementById("authSubmit");

                if (!/^[a-z0-9_]{3,20}$/.test(username)) {
                    showMessage(
                        "Username must be 3–20 characters and use only letters, numbers, or underscores.",
                        "#ff7777"
                    );
                    return;
                }

                submitButton.disabled = true;
                submitButton.textContent = "Please wait...";

                try {
                    const loginEmail = makeLoginEmail(username);

                    if (authMode === "signup") {

                        // Check whether the username is already taken.
                        const { data: existingUser, error: lookupError } =
                            await supabaseClient
                                .from("profiles")
                                .select("id")
                                .eq("username", username)
                                .maybeSingle();

                        if (lookupError) {
                            throw lookupError;
                        }

                        if (existingUser) {
                            throw new Error("That username is already taken.");
                        }

                        // Create the Supabase account.
                        const { data, error } =
                            await supabaseClient.auth.signUp({
                                email: loginEmail,
                                password: password,
                                options: {
                                    data: {
                                        username: username
                                    }
                                }
                            });

                        if (error) {
                            throw error;
                        }

                        if (!data.user || !data.session) {
                            throw new Error(
                                "Account created, but no login session was returned. Check that email confirmation is turned off."
                            );
                        }

                        // Save the username in the profiles table.
                        const { error: profileError } =
                            await supabaseClient
                                .from("profiles")
                                .insert({
                                    id: data.user.id,
                                    username: username
                                });

                        if (profileError) {
                            await supabaseClient.auth.signOut();

                            throw new Error(
                                "Your account was created, but your profile could not be saved: " +
                                profileError.message
                            );
                        }

                        showLoggedIn(username);
                    }

                    else {

                        // Log in using username and password.
                        const { data, error } =
                            await supabaseClient.auth.signInWithPassword({
                                email: loginEmail,
                                password: password
                            });

                        if (error) {
                            throw error;
                        }

                        showLoggedIn(username);
                    }

                } catch (error) {
                    showMessage(error.message, "#ff7777");
                }

                finally {
                    submitButton.disabled = false;
                    submitButton.textContent =
                        authMode === "signup" ? "Create Account" : "Login";
                }
            }
        );

        // LOG OUT
        async function logout() {
            const { error } = await supabaseClient.auth.signOut();

            if (error) {
                alert(error.message);
                return;
            }

            document.getElementById("mainButtons").classList.remove("hidden");
            document.getElementById("welcomeArea").classList.add("hidden");
        }

        // RESTORE LOGIN AFTER REFRESHING
        async function checkLogin() {
            const { data, error } = await supabaseClient.auth.getSession();

            if (error) {
                console.error(error);
                return;
            }

            if (data.session) {
                const username =
                    data.session.user.user_metadata?.username ||
                    data.session.user.email.split("@")[0];

                showLoggedIn(username);
            }
        }

        checkLogin();

    </script>

</body>
</html>
