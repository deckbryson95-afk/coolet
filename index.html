
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: "Puffet";
    src: url("puffet.ttf") format("truetype");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito Sans", sans-serif;
    background-color: #ffad42;
    background-image:
        linear-gradient(45deg, #f99b2e 25%, transparent 25%),
        linear-gradient(-45deg, #f99b2e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f99b2e 75%),
        linear-gradient(-45deg, transparent 75%, #f99b2e 75%);
    background-size: 60px 60px;
    background-position: 0 0, 0 30px, 30px -30px, -30px 0;
}

button {
    font-family: "Nunito Sans", sans-serif;
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

button:hover {
    filter: brightness(.92);
}

/* HOME PAGE */

#home {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    padding: 30px;
}

.logo {
    font-family: "Puffet", sans-serif;
    font-size: 100px;
    color: white;
    margin: 0;
    text-shadow: 4px 4px #b95b20;
}

.subtitle {
    font-size: 20px;
    color: white;
    font-weight: 800;
    margin: 5px 0 30px;
}

.login-button {
    background: #38c85a;
    color: white;
}

.signup-button {
    background: #238bdb;
    color: white;
}

/* LOGIN MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 10;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 350px;
    text-align: center;
}

.modal-content input {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-family: "Nunito Sans", sans-serif;
    font-size: 16px;
}

.submit-button {
    background: #38c85a;
    color: white;
    width: 100%;
}

.close-button {
    background: #ddd;
    color: #333;
    width: 100%;
    margin-top: 8px;
}

#message {
    font-size: 14px;
    overflow-wrap: anywhere;
}

/* STATS PAGE */

#statsPage {
    display: none;
    min-height: 100vh;
    padding: 28px;
}

.stats-layout {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 22px;
    align-items: stretch;
}

/* SIDEBAR */

.sidebar {
    width: 255px;
    min-height: calc(100vh - 56px);
    flex-shrink: 0;
    background: #292929;
    color: white;
    border-radius: 10px;
    padding: 20px 16px;
}

.sidebar-logo {
    font-family: "Puffet", sans-serif;
    font-size: 38px;
    color: white;
    text-align: center;
    margin: 0 0 28px;
    text-shadow: 2px 2px #b95b20;
}

.nav-button {
    display: block;
    width: 100%;
    padding: 12px 14px;
    margin: 7px 0;
    color: white;
    background: transparent;
    text-align: left;
    border-radius: 7px;
}

.nav-button.active {
    background: #454545;
}

.nav-button:hover {
    background: #454545;
}

/* MAIN CONTENT */

.stats-main {
    flex: 1;
    min-width: 0;
    min-height: calc(100vh - 56px);
    background: #292929;
    border-radius: 10px;
    padding: 26px;
    color: white;
}

.profile-area {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
}

.pfp {
    width: 75px;
    height: 75px;
    border-radius: 12px;
    background: #ffad42;
    border: 3px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 32px;
    font-weight: 900;
    flex-shrink: 0;
}

.profile-name {
    font-size: 25px;
    font-weight: 900;
    overflow-wrap: anywhere;
}

.profile-hint {
    color: #bbb;
    font-size: 14px;
    font-weight: 700;
}

/* ACTION BUTTONS */

.profile-actions {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.reward-button {
    background: #38b957;
    color: white;
}

.settings-button {
    background: #238bdb;
    color: white;
}

/* STATS CARDS */

.stats-title {
    font-size: 28px;
    font-weight: 900;
    margin: 0 0 22px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
}

.stat-card {
    background: #414141;
    border-radius: 8px;
    padding: 22px;
    min-height: 135px;
}

.stat-label {
    font-size: 17px;
    color: #ddd;
    font-weight: 800;
    margin-bottom: 12px;
}

.stat-number {
    font-size: 34px;
    font-weight: 900;
}

/* LOGOUT */

.logout-button {
    display: block;
    width: 100%;
    margin-top: 25px;
    background: #d94b42;
    color: white;
    text-align: left;
}

/* RESPONSIVE DESIGN */

@media (max-width: 950px) {
    .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 650px) {
    #statsPage {
        padding: 12px;
    }

    .stats-layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        min-height: auto;
    }

    .stats-main {
        width: 100%;
        min-height: auto;
        padding: 20px;
    }
}

@media (max-width: 400px) {
    .stats-grid {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 75px;
    }
}
</style>
</head>

<body>

<!-- HOME PAGE -->

<div id="home">
    <div class="container">
        <h1 class="logo">COOLET</h1>
        <p class="subtitle">Collect, trade, chat and more!</p>

        <div id="buttons">
            <button class="login-button" onclick="openModal('login')">
                Login
            </button>

            <button class="signup-button" onclick="openModal('signup')">
                Sign Up
            </button>
        </div>
    </div>
</div>

<!-- STATS PAGE -->

<div id="statsPage">
    <div class="stats-layout">

        <aside class="sidebar">
            <h1 class="sidebar-logo">COOLET</h1>

            <button class="nav-button active">Stats</button>
            <button class="nav-button">Leaderboard</button>
            <button class="nav-button">Chat</button>
            <button class="nav-button">Market</button>
            <button class="nav-button">Blooks</button>

            <button class="logout-button" onclick="logoutAccount()">
                Logout
            </button>
        </aside>

        <main class="stats-main">

            <div class="profile-area">
                <div class="pfp" id="pfp">C</div>

                <div>
                    <div class="profile-name" id="profileName">
                        Player
                    </div>

                    <div class="profile-hint">
                        Welcome to Coolet!
                    </div>
                </div>
            </div>

            <div class="profile-actions">
                <button class="reward-button" onclick="hourlyReward()">
                    Hourly Reward
                </button>

                <button class="settings-button" onclick="openSettings()">
                    Settings
                </button>
            </div>

            <h2 class="stats-title">Stats</h2>

            <div class="stats-grid">

                <div class="stat-card">
                    <div class="stat-label">Tokens</div>
                    <div class="stat-number" id="tokens">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Blooks Unlocked</div>
                    <div class="stat-number" id="blooks">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Texts Sent</div>
                    <div class="stat-number" id="textsSent">0</div>
                </div>

            </div>

        </main>
    </div>
</div>

<!-- LOGIN / SIGNUP MODAL -->

<div class="modal" id="modal">
    <div class="modal-content">

        <h2 id="modalTitle">Login</h2>

        <input
            id="username"
            placeholder="Username"
            maxlength="20"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button class="submit-button" onclick="submitAccount()">
            Continue
        </button>

        <button class="close-button" onclick="closeModal()">
            Cancel
        </button>

        <p id="message"></p>

    </div>
</div>

<script>

/* SUPABASE CONNECTION */

const SUPABASE_URL = "https://mfxmatyyvrjxkleiratk.supabase.co";
const SUPABASE_KEY = "sb_publishable_kfMaUjlxX04k1YWkJTu9mw_fq24cRu9";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentMode = "login";
let currentUserId = null;

/* OPEN LOGIN OR SIGNUP */

function openModal(mode) {
    currentMode = mode;

    document.getElementById("modal").style.display = "flex";

    document.getElementById("modalTitle").textContent =
        mode === "login" ? "Login" : "Sign Up";

    document.getElementById("message").textContent = "";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}

/* CLOSE MODAL */

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

/* LOGIN AND SIGNUP */

async function submitAccount() {
    const username = document.getElementById("username")
        .value.trim().toLowerCase();

    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        message.textContent =
            "Username must be 3–20 characters and use only letters, numbers, or underscores.";
        return;
    }

    if (password.length < 6) {
        message.textContent =
            "Password must be at least 6 characters.";
        return;
    }

    const email = username + "@mfxmatyyvrjxkleiratk.supabase.co";

    message.textContent = "Please wait...";

    if (currentMode === "signup") {

        const { data: existing, error: lookupError } =
            await supabaseClient
                .from("profiles")
                .select("username")
                .eq("username", username)
                .maybeSingle();

        if (lookupError) {
            message.textContent = lookupError.message;
            return;
        }

        if (existing) {
            message.textContent = "That username is already taken!";
            return;
        }

        const { data, error } =
            await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

        if (error) {
            message.textContent = error.message;
            return;
        }

        if (!data.user) {
            message.textContent =
                "Account creation did not finish. Please try again.";
            return;
        }

        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .insert({
                    id: data.user.id,
                    username: username
                });

        if (profileError) {
            message.textContent =
                "Account created, but profile setup failed: " +
                profileError.message;
            return;
        }

        await showAccount(data.user.id, username);

    } else {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            message.textContent = error.message;
            return;
        }

        await showAccount(data.user.id, username);
    }
}

/* SHOW ACCOUNT */

async function showAccount(userId, username) {
    currentUserId = userId;

    closeModal();

    document.getElementById("home").style.display = "none";
    document.getElementById("statsPage").style.display = "block";

    document.getElementById("profileName").textContent = username;

    document.getElementById("pfp").textContent =
        username.charAt(0).toUpperCase();

    await loadStats();
}

/* LOAD STATS */

async function loadStats() {
    if (!currentUserId) return;

    const { data: profile, error } =
        await supabaseClient
            .from("profiles")
            .select("tokens, collection, texts_sent")
            .eq("id", currentUserId)
            .maybeSingle();

    if (error) {
        alert("Could not load stats: " + error.message);
        return;
    }

    if (!profile) return;

    const collection = Array.isArray(profile.collection)
        ? profile.collection
        : [];

    document.getElementById("tokens").textContent =
        Number(profile.tokens || 0).toLocaleString();

    document.getElementById("blooks").textContent =
        collection.length.toLocaleString();

    document.getElementById("textsSent").textContent =
        Number(profile.texts_sent || 0).toLocaleString();
}

/* LOGOUT */

async function logoutAccount() {
    await supabaseClient.auth.signOut();

    currentUserId = null;

    document.getElementById("statsPage").style.display = "none";
    document.getElementById("home").style.display = "flex";
}

/* RESTORE LOGIN SESSION */

async function restoreSession() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {

        const { data: profile } =
            await supabaseClient
                .from("profiles")
                .select("username")
                .eq("id", data.session.user.id)
                .maybeSingle();

        if (profile) {
            await showAccount(
                data.session.user.id,
                profile.username
            );
        }
    }
}

/* BUTTONS */

function hourlyReward() {
    alert("Hourly rewards are not set up yet!");
}

function openSettings() {
    alert("Settings are coming soon!");
}

/* START */

restoreSession();

</script>

</body>
</html>
