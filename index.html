
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@font-face {
    font-family: "Puffet";
    src: url("puffet.ttf") format("truetype");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito Sans", sans-serif;
    background-color: #ffad42;
    background-image:
        linear-gradient(45deg, #f99b2e 25%, transparent 25%),
        linear-gradient(-45deg, #f99b2e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f99b2e 75%),
        linear-gradient(-45deg, transparent 75%, #f99b2e 75%);
    background-size: 60px 60px;
    background-position: 0 0, 0 30px, 30px -30px, -30px 0;
}

button,
input {
    font-family: "Nunito Sans", sans-serif;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

button:hover {
    filter: brightness(.92);
}

#home {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    padding: 30px;
}

.logo {
    font-family: "Puffet", sans-serif;
    font-size: 100px;
    color: white;
    margin: 0;
    text-shadow: 4px 4px #b95b20;
}

.subtitle {
    font-size: 20px;
    color: white;
    font-weight: 800;
    margin: 5px 0 30px;
}

.login-button {
    background: #38c85a;
    color: white;
}

.signup-button {
    background: #238bdb;
    color: white;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 10;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 350px;
    text-align: center;
}

.modal-content input {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

.submit-button {
    background: #38c85a;
    color: white;
    width: 100%;
}

.close-button {
    background: #ddd;
    color: #333;
    width: 100%;
}

#message {
    font-size: 14px;
    overflow-wrap: anywhere;
}

/* STATS PAGE */

#statsPage {
    display: none;
    min-height: 100vh;
    padding: 25px;
}

.stats-layout {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 20px;
    align-items: flex-start;
}

.sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #333;
    color: white;
    border-radius: 12px;
    padding: 18px;
}

.profile {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    overflow-wrap: anywhere;
}

.pfp {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #ffad42;
    border: 3px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 24px;
    font-weight: 900;
    flex-shrink: 0;
}

.profile-name {
    font-size: 18px;
    font-weight: 900;
}

.side-button {
    display: block;
    width: 100%;
    margin: 10px 0;
    color: white;
    background: #505050;
    text-align: left;
}

.reward-button {
    background: #38b957;
}

.settings-button {
    background: #238bdb;
}

.logout-button {
    background: #d94b42;
}

.stats-main {
    flex: 1;
    min-width: 0;
    background: #202020;
    border: 2px solid #202020;
    border-radius: 12px;
    padding: 22px;
    color: white;
}

.stats-title {
    font-size: 27px;
    font-weight: 900;
    margin: 0 0 20px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
}

.stat-card {
    background: #494949;
    border-radius: 10px;
    padding: 22px;
    min-height: 115px;
}

.stat-label {
    font-size: 16px;
    font-weight: 700;
    color: #ddd;
    margin-bottom: 12px;
}

.stat-number {
    font-size: 30px;
    font-weight: 900;
}

@media (max-width: 800px) {
    .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 650px) {
    #statsPage {
        padding: 12px;
    }

    .stats-layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
    }

    .stats-main {
        width: 100%;
    }
}

@media (max-width: 400px) {
    .stats-grid {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 72px;
    }
}
</style>
</head>

<body>

<div id="home">
    <div class="container">
        <h1 class="logo">COOLET</h1>
        <p class="subtitle">Collect, trade, chat and more!</p>
        <div id="buttons">
            <button class="login-button" onclick="openModal('login')">Login</button>
            <button class="signup-button" onclick="openModal('signup')">Sign Up</button>
        </div>
    </div>
</div>

<div id="statsPage">
    <div class="stats-layout">
        <aside class="sidebar">
            <div class="profile">
                <div class="pfp" id="pfp">C</div>
                <div class="profile-name" id="profileName">Player</div>
            </div>

            <button class="side-button reward-button" onclick="hourlyReward()">
                Hourly Reward
            </button>

            <button class="side-button settings-button" onclick="openSettings()">
                Settings
            </button>

            <button class="side-button logout-button" onclick="logoutAccount()">
                Logout
            </button>
        </aside>

        <main class="stats-main">
            <h2 class="stats-title">Stats</h2>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Tokens</div>
                    <div class="stat-number" id="tokens">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Blooks Unlocked</div>
                    <div class="stat-number" id="blooks">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Texts Sent</div>
                    <div class="stat-number" id="textsSent">0</div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Login</h2>

        <input id="username" placeholder="Username" maxlength="20" autocomplete="username">

        <input id="password" type="password" placeholder="Password" autocomplete="current-password">

        <button class="submit-button" onclick="submitAccount()">Continue</button>

        <button class="close-button" onclick="closeModal()">Cancel</button>

        <p id="message"></p>
    </div>
</div>

<script>
const SUPABASE_URL = "https://mfxmatyyvrjxkleiratk.supabase.co";
const SUPABASE_KEY = "sb_publishable_kfMaUjlxX04k1YWkJTu9mw_fq24cRu9";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentMode = "login";
let currentUserId = null;

function openModal(mode) {
    currentMode = mode;

    document.getElementById("modal").style.display = "flex";

    document.getElementById("modalTitle").textContent =
        mode === "login" ? "Login" : "Sign Up";

    document.getElementById("message").textContent = "";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

async function submitAccount() {
    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        message.textContent =
            "Username must be 3–20 characters and use only letters, numbers, or underscores.";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    const email = username + "@mfxmatyyvrjxkleiratk.supabase.co";

    message.textContent = "Please wait...";

    if (currentMode === "signup") {
        const { data: existing, error: lookupError } = await supabaseClient
            .from("profiles")
            .select("username")
            .eq("username", username)
            .maybeSingle();

        if (lookupError) {
            message.textContent = lookupError.message;
            return;
        }

        if (existing) {
            message.textContent = "That username is already taken!";
            return;
        }

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            message.textContent = error.message;
            return;
        }

        if (!data.user) {
            message.textContent =
                "Account creation did not finish. Please try again.";
            return;
        }

        const { error: profileError } = await supabaseClient
            .from("profiles")
            .insert({
                id: data.user.id,
                username: username
            });

        if (profileError) {
            message.textContent =
                "Account created, but profile setup failed: " + profileError.message;
            return;
        }

        await showAccount(data.user.id, username);

    } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            message.textContent = error.message;
            return;
        }

        await showAccount(data.user.id, username);
    }
}

async function showAccount(userId, username) {
    currentUserId = userId;

    closeModal();

    document.getElementById("home").style.display = "none";
    document.getElementById("statsPage").style.display = "block";
    document.getElementById("profileName").textContent = username;
    document.getElementById("pfp").textContent =
        username.charAt(0).toUpperCase();

    await loadStats();
}

async function loadStats() {
    if (!currentUserId) return;

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("tokens, collection, texts_sent")
        .eq("id", currentUserId)
        .maybeSingle();

    if (error) {
        alert("Could not load stats: " + error.message);
        return;
    }

    if (!profile) return;

    const collection = Array.isArray(profile.collection)
        ? profile.collection
        : [];

    document.getElementById("tokens").textContent =
        Number(profile.tokens || 0).toLocaleString();

    document.getElementById("blooks").textContent =
        collection.length.toLocaleString();

    document.getElementById("textsSent").textContent =
        Number(profile.texts_sent || 0).toLocaleString();
}

async function logoutAccount() {
    await supabaseClient.auth.signOut();

    currentUserId = null;

    document.getElementById("statsPage").style.display = "none";
    document.getElementById("home").style.display = "flex";
}

async function restoreSession() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        const { data: profile } = await supabaseClient
            .from("profiles")
            .select("username")
            .eq("id", data.session.user.id)
            .maybeSingle();

        if (profile) {
            await showAccount(data.session.user.id, profile.username);
        }
    }
}

function hourlyReward() {
    alert("Hourly rewards are not set up yet!");
}

function openSettings() {
    alert("Settings are coming soon!");
}

restoreSession();
</script>

</body>
</html>
