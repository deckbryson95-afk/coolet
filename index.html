
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolet</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@font-face {
    font-family: "Puffet";
    src: url("puffet.ttf") format("truetype");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background-color: #ffad42;
    background-image:
        linear-gradient(45deg, #f99b2e 25%, transparent 25%),
        linear-gradient(-45deg, #f99b2e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f99b2e 75%),
        linear-gradient(-45deg, transparent 75%, #f99b2e 75%);
    background-size: 60px 60px;
    background-position: 0 0, 0 30px, 30px -30px, -30px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    text-align: center;
    padding: 30px;
}

.logo {
    font-family: "Puffet", sans-serif;
    font-size: 100px;
    color: white;
    margin: 0;
    text-shadow: 4px 4px #b95b20;
}

.subtitle {
    font-size: 20px;
    color: white;
    font-weight: bold;
    margin: 5px 0 30px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 25px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin: 7px;
}

.login-button {
    background: #38c85a;
    color: white;
}

.signup-button {
    background: #238bdb;
    color: white;
}

button:hover {
    filter: brightness(0.92);
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 350px;
    text-align: center;
}

.modal-content h2 {
    margin-top: 0;
}

.modal-content input {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

.submit-button {
    background: #38c85a;
    color: white;
    width: 100%;
}

.close-button {
    background: #ddd;
    color: #333;
    width: 100%;
}

#message {
    font-size: 14px;
    overflow-wrap: anywhere;
}

#accountArea {
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.logout-button {
    background: #e74c3c;
    color: white;
}
</style>
</head>

<body>

<div class="container">
    <h1 class="logo">COOLET</h1>
    <p class="subtitle">Collect, trade, chat and more!</p>

    <div id="buttons">
        <button class="login-button" onclick="openModal('login')">Login</button>
        <button class="signup-button" onclick="openModal('signup')">Sign Up</button>
    </div>

    <div id="accountArea" style="display:none;"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Login</h2>

        <input id="username" placeholder="Username" maxlength="20" autocomplete="username">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password">

        <button class="submit-button" onclick="submitAccount()">Continue</button>
        <button class="close-button" onclick="closeModal()">Cancel</button>

        <p id="message"></p>
    </div>
</div>

<script>
const SUPABASE_URL = "https://mfxmatyyvrjxkleiratk.supabase.co";
const SUPABASE_KEY = "sb_publishable_kfMaUjlxX04k1YWkJTu9mw_fq24cRu9";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentMode = "login";

function openModal(mode) {
    currentMode = mode;
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalTitle").textContent =
        mode === "login" ? "Login" : "Sign Up";
    document.getElementById("message").textContent = "";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

async function submitAccount() {
    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        message.textContent = "Username must be 3–20 characters and use only letters, numbers, or underscores.";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    const email = username + "@mfxmatyyvrjxkleiratk.supabase.co";
    message.textContent = "Please wait...";

    if (currentMode === "signup") {
        const { data: existing, error: lookupError } = await supabaseClient
            .from("profiles")
            .select("username")
            .eq("username", username)
            .maybeSingle();

        if (lookupError) {
            message.textContent = lookupError.message;
            return;
        }

        if (existing) {
            message.textContent = "That username is already taken!";
            return;
        }

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            message.textContent = error.message;
            return;
        }

        if (!data.user) {
            message.textContent = "Account creation did not finish. Please try again.";
            return;
        }

        const { error: profileError } = await supabaseClient
            .from("profiles")
            .insert({
                id: data.user.id,
                username: username
            });

        if (profileError) {
            message.textContent = "Account created, but profile setup failed: " + profileError.message;
            return;
        }

        message.textContent = "Account created!";
        await showAccount(username);
    } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            message.textContent = error.message;
            return;
        }

        await showAccount(username);
    }
}

async function showAccount(username) {
    closeModal();
    document.getElementById("buttons").style.display = "none";

    const accountArea = document.getElementById("accountArea");
    accountArea.style.display = "block";
    accountArea.innerHTML = "";

    const welcome = document.createElement("p");
    welcome.textContent = "Welcome, " + username + "!";

    const logout = document.createElement("button");
    logout.className = "logout-button";
    logout.textContent = "Logout";
    logout.onclick = logoutAccount;

    accountArea.append(welcome, logout);
}

async function logoutAccount() {
    await supabaseClient.auth.signOut();
    document.getElementById("accountArea").style.display = "none";
    document.getElementById("buttons").style.display = "block";
}

async function restoreSession() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        const { data: profile } = await supabaseClient
            .from("profiles")
            .select("username")
            .eq("id", data.session.user.id)
            .maybeSingle();

        if (profile) {
            await showAccount(profile.username);
        }
    }
}

restoreSession();
</script>

</body>
</html>
