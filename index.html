
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coolet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@font-face {
    font-family: "Puffet";
    src: url("puffet.ttf") format("truetype");
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background-color: #ffad42;
    background-image:
        linear-gradient(45deg, #f99b2e 25%, transparent 25%),
        linear-gradient(-45deg, #f99b2e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f99b2e 75%),
        linear-gradient(-45deg, transparent 75%, #f99b2e 75%);
    background-size: 60px 60px;
    background-position: 0 0, 0 30px, 30px -30px, -30px 0;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { filter: brightness(.92); }

/* HOME */

#home {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container { padding: 30px; }

.logo {
    font-family: "Puffet", sans-serif;
    font-size: 100px;
    color: white;
    margin: 0;
    text-shadow: 4px 4px #b95b20;
}

.subtitle {
    font-size: 20px;
    color: white;
    font-weight: bold;
    margin: 5px 0 30px;
}

.login-button { background: #38c85a; color: white; }
.signup-button { background: #238bdb; color: white; }

/* LOGIN MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 10;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 350px;
    text-align: center;
}

.modal-content input {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

.submit-button {
    background: #38c85a;
    color: white;
    width: 100%;
}

.close-button {
    background: #ddd;
    color: #333;
    width: 100%;
}

#message {
    font-size: 14px;
    overflow-wrap: anywhere;
}

/* STATS PAGE */

#statsPage {
    display: none;
    min-height: 100vh;
    color: white;
}

.stats-layout {
    display: flex;
    min-height: 100vh;
    width: 100%;
}

/* SIDEBAR */

.sidebar {
    width: 230px;
    flex-shrink: 0;
    min-height: 100vh;
    padding: 22px 10px;
    background: rgba(35, 35, 35, 0.96);
    border-right: 5px solid #202020;
    color: white;
}

.sidebar-logo {
    font-family: "Puffet", sans-serif;
    font-size: 42px;
    text-align: center;
    margin: 10px 0 55px;
    color: white;
}

.side-button {
    display: block;
    width: 100%;
    padding: 13px 15px;
    margin: 5px 0;
    border-radius: 8px;
    background: transparent;
    color: white;
    font-size: 19px;
    font-weight: normal;
    text-align: left;
}

.side-button:hover { background: #444; }
.side-button.active { background: #484848; }

.logout-button {
    margin-top: 35px;
    background: #a9362e;
}

/* MAIN CONTENT */

.stats-main {
    flex: 1;
    min-width: 0;
    padding: 70px 26px 35px;
}

/* PROFILE */

.profile-area {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 28px;
}

.pfp {
    width: 180px;
    height: 155px;
    flex-shrink: 0;
    border-radius: 18px;
    background: #ffad16;
    border: 4px solid #f28b00;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 65px;
    font-weight: bold;
}

.profile-info {
    background: rgba(35, 35, 35, 0.94);
    border-radius: 18px;
    padding: 22px 48px;
    min-width: 405px;
    min-height: 128px;
}

.profile-name {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 8px;
    overflow-wrap: anywhere;
}

.profile-hint {
    font-size: 21px;
    color: #ddd;
}

/* ACTION BUTTONS */

.action-buttons {
    display: flex;
    gap: 14px;
    margin-bottom: 45px;
}

.action-button {
    width: 305px;
    height: 72px;
    border-radius: 17px;
    color: white;
    font-size: 25px;
}

.reward-button { background: #f15b16; }
.settings-button { background: #168fe0; }

/* STATS PANEL */

.stats-panel {
    background: #202020;
    border: 2px solid #202020;
    border-radius: 14px;
    padding: 0 20px 27px;
    width: 100%;
    box-shadow: none;
}

.stats-title {
    display: inline-block;
    background: #202020;
    font-family: "Puffet", sans-serif;
    font-size: 43px;
    margin: -1px 0 15px;
    padding: 8px 10px;
    color: white;
    border-radius: 15px 15px 0 0;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

.stat-card {
    min-height: 150px;
    background: #484848;
    border: none;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
}

.stat-information { text-align: center; }

.stat-label {
    font-size: 27px;
    font-weight: bold;
    color: #ddd;
    margin-bottom: 10px;
}

.stat-number {
    font-size: 65px;
    font-weight: bold;
    line-height: 1;
}

/* RESPONSIVE */

@media (max-width: 900px) {
    .sidebar { width: 180px; }
    .stats-main { padding: 30px 15px; }

    .profile-info {
        min-width: 0;
        padding: 18px;
    }

    .pfp {
        width: 110px;
        height: 110px;
    }

    .profile-name { font-size: 25px; }

    .stats-grid {
        grid-template-columns: 1fr;
    }

    .action-button {
        width: 50%;
        font-size: 18px;
    }
}

@media (max-width: 520px) {
    .stats-layout { flex-direction: column; }

    .sidebar {
        width: 100%;
        min-height: auto;
    }

    .sidebar-logo { margin: 5px 0 15px; }

    .side-button {
        display: inline-block;
        width: auto;
    }

    .profile-area { flex-wrap: wrap; }

    .action-buttons { flex-wrap: wrap; }

    .action-button { width: 100%; }
}
</style>
</head>

<body>

<!-- HOME PAGE -->

<div id="home">
    <div class="container">
        <h1 class="logo">COOLET</h1>
        <p class="subtitle">Collect, trade, chat and more!</p>

        <div id="buttons">
            <button class="login-button" onclick="openModal('login')">
                Login
            </button>

            <button class="signup-button" onclick="openModal('signup')">
                Sign Up
            </button>
        </div>
    </div>
</div>

<!-- STATS PAGE -->

<div id="statsPage">
    <div class="stats-layout">

        <aside class="sidebar">
            <h1 class="sidebar-logo">COOLET</h1>

            <button class="side-button active">Stats</button>
            <button class="side-button">Leaderboard</button>
            <button class="side-button">Chat</button>
            <button class="side-button">Collection</button>
            <button class="side-button">Market</button>
            <button class="side-button">Blooks</button>

            <button class="side-button" onclick="openSettings()">
                Settings
            </button>

            <button class="side-button logout-button" onclick="logoutAccount()">
                Logout
            </button>
        </aside>

        <main class="stats-main">

            <div class="profile-area">
                <div class="pfp" id="pfp">C</div>

                <div class="profile-info">
                    <div class="profile-name" id="profileName">Player</div>
                    <div class="profile-hint">Click your pfp to change it!</div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-button reward-button" onclick="hourlyReward()">
                    Hourly Reward
                </button>

                <button class="action-button settings-button" onclick="openSettings()">
                    Settings
                </button>
            </div>

            <section class="stats-panel">
                <h2 class="stats-title">Stats</h2>

                <div class="stats-grid">

                    <div class="stat-card">
                        <div class="stat-information">
                            <div class="stat-label">Tokens</div>
                            <div class="stat-number" id="tokens">0</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-information">
                            <div class="stat-label">Blooks Unlocked</div>
                            <div class="stat-number" id="blooks">0</div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-information">
                            <div class="stat-label">Texts Sent</div>
                            <div class="stat-number" id="textsSent">0</div>
                        </div>
                    </div>

                </div>
            </section>

        </main>
    </div>
</div>

<!-- LOGIN / SIGNUP MODAL -->

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Login</h2>

        <input
            id="username"
            placeholder="Username"
            maxlength="20"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button class="submit-button" onclick="submitAccount()">
            Continue
        </button>

        <button class="close-button" onclick="closeModal()">
            Cancel
        </button>

        <p id="message"></p>
    </div>
</div>

<script>

/* SUPABASE */

const SUPABASE_URL =
    "https://mfxmatyyvrjxkleiratk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_kfMaUjlxX04k1YWkJTu9mw_fq24cRu9";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentMode = "login";
let currentUserId = null;

/* MODAL */

function openModal(mode) {
    currentMode = mode;

    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalTitle").textContent =
        mode === "login" ? "Login" : "Sign Up";

    document.getElementById("message").textContent = "";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

/* ACCOUNT */

async function submitAccount() {
    const username = document.getElementById("username")
        .value.trim().toLowerCase();

    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        message.textContent =
            "Username must be 3–20 characters and use only letters, numbers, or underscores.";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    const email =
        username + "@mfxmatyyvrjxkleiratk.supabase.co";

    message.textContent = "Please wait...";

    if (currentMode === "signup") {
        const { data: existing, error: lookupError } =
            await supabaseClient
                .from("profiles")
                .select("username")
                .eq("username", username)
                .maybeSingle();

        if (lookupError) {
            message.textContent = lookupError.message;
            return;
        }

        if (existing) {
            message.textContent = "That username is already taken!";
            return;
        }

        const { data, error } =
            await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

        if (error) {
            message.textContent = error.message;
            return;
        }

        if (!data.user) {
            message.textContent =
                "Account creation did not finish. Please try again.";
            return;
        }

        const { error: profileError } =
            await supabaseClient
                .from("profiles")
                .insert({
                    id: data.user.id,
                    username: username
                });

        if (profileError) {
            message.textContent =
                "Account created, but profile setup failed: " +
                profileError.message;
            return;
        }

        await showAccount(data.user.id, username);

    } else {
        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            message.textContent = error.message;
            return;
        }

        await showAccount(data.user.id, username);
    }
}

/* SHOW ACCOUNT */

async function showAccount(userId, username) {
    currentUserId = userId;

    closeModal();

    document.getElementById("home").style.display = "none";
    document.getElementById("statsPage").style.display = "block";

    document.getElementById("profileName").textContent = username;
    document.getElementById("pfp").textContent =
        username.charAt(0).toUpperCase();

    await loadStats();
}

/* LOAD STATS */

async function loadStats() {
    if (!currentUserId) return;

    const { data: profile, error } =
        await supabaseClient
            .from("profiles")
            .select("tokens, total_tokens, collection, texts_sent")
            .eq("id", currentUserId)
            .maybeSingle();

    if (error) {
        alert("Could not load stats: " + error.message);
        return;
    }

    if (!profile) return;

    const collection = Array.isArray(profile.collection)
        ? profile.collection
        : [];

    document.getElementById("tokens").textContent =
        Number(profile.tokens || 0).toLocaleString();

    document.getElementById("blooks").textContent =
        collection.length.toLocaleString();

    document.getElementById("textsSent").textContent =
        Number(profile.texts_sent || 0).toLocaleString();
}

/* LOGOUT */

async function logoutAccount() {
    await supabaseClient.auth.signOut();

    currentUserId = null;

    document.getElementById("statsPage").style.display = "none";
    document.getElementById("home").style.display = "flex";
}

/* RESTORE SESSION */

async function restoreSession() {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        const { data: profile } =
            await supabaseClient
                .from("profiles")
                .select("username")
                .eq("id", data.session.user.id)
                .maybeSingle();

        if (profile) {
            await showAccount(data.session.user.id, profile.username);
        }
    }
}

/* BUTTONS */

function hourlyReward() {
    alert("Hourly rewards are not set up yet!");
}

function openSettings() {
    alert("Settings are coming soon!");
}

restoreSession();

</script>

</body>
</html>
